spring:
  application:
    name: support-agent
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/support}
    username: ${SPRING_DATASOURCE_USERNAME:support}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 3000

catalog:
  feed-url: ${CATALOG_FEED_URL:}
  feed-file: ${CATALOG_FEED_FILE:}
  knowledge-file: ${CATALOG_KNOWLEDGE_FILE:}
  sync-cron: ${CATALOG_SYNC_CRON:0 0 4 * * *}
  sync-zone: ${CATALOG_SYNC_ZONE:Europe/Moscow}

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

chat:
  public-origin: ${CHAT_PUBLIC_ORIGIN:http://localhost:8080}
  turn-timeout-ms: ${CHAT_TURN_TIMEOUT_MS:90000}
  cold-turn-timeout-ms: ${CHAT_COLD_TURN_TIMEOUT_MS:120000}
  model-idle-ms: ${CHAT_MODEL_IDLE_MS:15000}
  parallel-turns: ${CHAT_PARALLEL_TURNS:8}
  quotes-enabled: ${CHAT_QUOTES_ENABLED:false}

ml:
  base-url: ${ML_BASE_URL:}
  data-region: ${ML_DATA_REGION:}
  service-token: ${ML_SERVICE_TOKEN:}
  max-context-bytes: ${ML_MAX_CONTEXT_BYTES:24000}
