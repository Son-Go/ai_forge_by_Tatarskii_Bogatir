[project]
name = "softline-ml-service"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.135,<1",
    "httpx>=0.28,<1",
    "httpx-sse>=0.4.3,<1",
    "prometheus-client>=0.22,<1",
    "pydantic-settings>=2.10,<3",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
