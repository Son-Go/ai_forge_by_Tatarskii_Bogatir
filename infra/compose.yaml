services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/support
      SPRING_DATASOURCE_USERNAME: support
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CATALOG_FEED_URL: ${CATALOG_FEED_URL:-}
      CATALOG_FEED_FILE: ${CATALOG_FEED_FILE:-}
      CATALOG_SYNC_CRON: ${CATALOG_SYNC_CRON:-0 0 4 * * *}
      CATALOG_SYNC_ZONE: ${CATALOG_SYNC_ZONE:-Europe/Moscow}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTP_PORT:-8080}:80"
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../frontend:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
