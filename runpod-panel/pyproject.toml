[project]
name = "forge-runpod-panel"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
