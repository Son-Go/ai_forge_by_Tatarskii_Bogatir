services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: support
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      target: backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/support
      SPRING_DATASOURCE_USERNAME: support
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      CATALOG_FEED_URL: ${CATALOG_FEED_URL:-}
      CATALOG_FEED_FILE: ${CATALOG_FEED_FILE:-}
      CATALOG_KNOWLEDGE_FILE: ${CATALOG_KNOWLEDGE_FILE:-}
      CATALOG_SYNC_CRON: ${CATALOG_SYNC_CRON:-0 0 4 * * *}
      CATALOG_SYNC_ZONE: ${CATALOG_SYNC_ZONE:-Europe/Moscow}
      CHAT_PUBLIC_ORIGIN: ${CHAT_PUBLIC_ORIGIN:-http://localhost:8080}
      CHAT_TURN_TIMEOUT_MS: ${CHAT_TURN_TIMEOUT_MS:-90000}
      CHAT_COLD_TURN_TIMEOUT_MS: ${CHAT_COLD_TURN_TIMEOUT_MS:-180000}
      CHAT_MODEL_IDLE_MS: ${CHAT_MODEL_IDLE_MS:-15000}
      CHAT_PARALLEL_TURNS: ${CHAT_PARALLEL_TURNS:-8}
      CHAT_DISCOUNT_PERCENT: ${CHAT_DISCOUNT_PERCENT:-5}
      CHAT_QUOTES_ENABLED: ${CHAT_QUOTES_ENABLED:-false}
      CHAT_INVOICE_DRAFTS_ENABLED: ${CHAT_INVOICE_DRAFTS_ENABLED:-false}
      CHAT_TEST_PAYMENT_INVOICES_ENABLED: ${CHAT_TEST_PAYMENT_INVOICES_ENABLED:-false}
      MANAGER_ACCESS_TOKENS: ${MANAGER_ACCESS_TOKENS:-}
      FORWARD_HEADERS_STRATEGY: native
      FAQ_REVIEW_ENABLED: ${FAQ_REVIEW_ENABLED:-false}
      FAQ_REVIEW_TIMEOUT_MS: ${FAQ_REVIEW_TIMEOUT_MS:-30000}
      ML_BASE_URL: ${ML_BASE_URL:-}
      ML_DATA_REGION: ${ML_DATA_REGION:-}
      ML_DATA_SCOPE: ${ML_DATA_SCOPE:-}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      ML_MAX_CONTEXT_BYTES: ${ML_MAX_CONTEXT_BYTES:-24000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    build:
      context: ..
      target: caddy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTP_PORT:-8080}:80"
      - "${EDGE_BIND:-127.0.0.1}:${EDGE_HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
